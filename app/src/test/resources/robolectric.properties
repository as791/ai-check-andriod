# Pins the Android SDK version Robolectric simulates during unit tests,
# independent of the app's real compileSdk/targetSdk (35) in app/build.gradle.kts.
# Robolectric ships its own per-API-level "android-all" jars, and a targetSdk newer
# than what the resolved Robolectric release supports fails test *initialization*
# (DefaultSdkPicker) before any test code runs — not a real app compatibility issue.
# 33 (Android 13) is a long-stable, broadly supported Robolectric target.
sdk=33
