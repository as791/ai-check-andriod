name: Android CI

# Runs on GitHub's hosted runners, which have normal internet access to
# dl.google.com/maven.google.com — unlike the sandbox this project was scaffolded
# in, which has that host blocked by network policy (see README "Known
# limitations"). This workflow is the actual build/test gate for the project.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Not android-actions/setup-android@v3: it unconditionally runs
      # `sdkmanager tools`, and Google has fully removed that legacy package
      # from the SDK repository, so the action now crashes on every runner
      # before any Gradle step gets to run. Search for a preinstalled SDK
      # first (an earlier crash trace showed one at
      # /usr/local/lib/android/sdk on this runner image, but that path isn't
      # guaranteed and $ANDROID_HOME wasn't set for this step), falling back
      # to downloading cmdline-tools directly so this doesn't depend on
      # unstated runner-image internals either way.
      - name: Set up Android SDK
        run: |
          : "${ANDROID_SDK_ROOT:=${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -maxdepth 4 -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | sort -V | tail -1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "No cmdline-tools found under $ANDROID_SDK_ROOT - downloading them"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fsSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests (domain + app)
        run: ./gradlew testDebugUnitTest :domain:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-check-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            domain/build/reports/tests
            app/build/reports/lint-results-debug.html
