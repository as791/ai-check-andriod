name: Model eval

# Benchmarks the bundled classifier (app/src/main/assets/models/ai-image-detector.onnx)
# against public labeled real-vs-AI datasets. Manual only: it downloads a few
# hundred MB of images and takes a while, and nothing here gates the app build.
# Images are used only inside the runner; only the numbers are uploaded.
# See internal-docs/MODEL.md "Measured accuracy".
on:
  workflow_dispatch:
    inputs:
      samples_per_class:
        description: Images per class (real / AI) per dataset
        default: '250'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install evaluation dependencies (CPU only, no torch)
        run: pip install "onnxruntime>=1.18,<2" "pillow>=10,<12" "numpy>=1.26,<3" "datasets>=2.19,<5"

      - name: Fetch datasets
        run: tools/fetch_all_eval_data.sh ${{ inputs.samples_per_class }}

      - name: Evaluate
        run: |
          mkdir -p eval-results
          for dir in eval-data/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            python tools/evaluate.py \
              --model app/src/main/assets/models/ai-image-detector.onnx \
              --dataset "$dir" --dataset-name "$name" \
              --conditions original,jpeg75,social \
              --preprocess squash,center_crop,avg \
              --json-dir eval-results \
              --scores-csv eval-results/scores.csv \
              | tee "eval-results/$name.txt" || echo "::warning::evaluation failed for $name"
            echo "::endgroup::"
          done

      - name: Report
        if: always()
        run: |
          mkdir -p eval-results
          python tools/eval_report.py eval-results > eval-results/report.md
          if [ -f eval-results/scores.csv ]; then
            python tools/calibrate.py eval-results/scores.csv --json eval-results/calibration.json \
              > eval-results/calibration.md || echo "::warning::calibration failed"
            cat eval-results/calibration.md >> eval-results/report.md
          fi
          cat eval-results/report.md >> "$GITHUB_STEP_SUMMARY"
          cat eval-results/report.md

      - name: Upload results (numbers only, no images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-results
          path: eval-results/
