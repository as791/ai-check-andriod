name: Android CI

# Runs on GitHub's hosted runners, which have normal internet access to
# dl.google.com/maven.google.com — unlike the sandbox this project was scaffolded
# in, which has that host blocked by network policy (see README "Known
# limitations"). This workflow is the actual build/test gate for the project.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Not android-actions/setup-android@v3: it unconditionally runs
      # `sdkmanager tools`, and Google has fully removed that legacy package
      # from the SDK repository, so the action now crashes on every runner
      # before any Gradle step gets to run. ubuntu-latest already ships a
      # preinstalled SDK under $ANDROID_HOME (just not on PATH for a plain
      # run: step), so locate sdkmanager there and install exactly the
      # packages this project needs.
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 3 -path '*/cmdline-tools/*/bin/sdkmanager' | sort -V | tail -1)"
          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests (domain + app)
        run: ./gradlew testDebugUnitTest :domain:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-check-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            domain/build/reports/tests
            app/build/reports/lint-results-debug.html
